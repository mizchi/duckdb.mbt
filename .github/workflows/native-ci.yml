name: Native CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION="latest" bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install DuckDB 1.4 C API
        run: |
          case "$RUNNER_OS" in
            macOS) artifact=libduckdb-osx-universal.zip; library=libduckdb.dylib ;;
            Linux) artifact=libduckdb-linux-amd64.zip; library=libduckdb.so ;;
          esac
          curl -fsSL -o /tmp/libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v1.4.4/$artifact"
          unzip -o /tmp/libduckdb.zip -d /tmp/libduckdb
          sudo mkdir -p /usr/local/lib /usr/local/include
          sudo cp "/tmp/libduckdb/$library" /usr/local/lib/
          sudo cp /tmp/libduckdb/duckdb.h /usr/local/include/
          if [ "$RUNNER_OS" = Linux ]; then sudo ldconfig; fi

      - name: Moon version
        run: moon version --all

      - name: Update Moon registry
        run: moon update

      - name: Check native
        run: moon check --target native

      - name: Test native
        run: moon test --target native
